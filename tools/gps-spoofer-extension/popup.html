<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 250px;
            font-family: 'Inter', sans-serif;
            padding: 15px;
            background: #0c0c0c;
            color: #fff;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 15px 0;
            color: #ff3e00;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #ff3e00;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .toggle-label {
            font-size: 13px;
            font-weight: bold;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #ff3e00;
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }

        button {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 6px;
            background: #ff3e00;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 8px;
        }

        button.secondary {
            background: #333;
            color: #aaa;
        }

        button:hover {
            opacity: 0.9;
        }

        .status {
            font-size: 11px;
            color: #44bb44;
            margin-top: 5px;
            text-align: center;
            height: 14px;
        }

        .hint {
            font-size: 10px;
            color: #555;
            margin-top: 10px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <h2>Ghost GPS <span>v10.29</span></h2>

    <div class="toggle-container">
        <span class="toggle-label" id="state-text">OFF</span>
        <label class="switch">
            <input type="checkbox" id="enabled">
            <span class="slider"></span>
        </label>
    </div>

    <div class="input-group">
        <label>Latitude</label>
        <input type="number" id="lat" value="25.821702" step="any">
    </div>
    <div class="input-group">
        <label>Longitude</label>
        <input type="number" id="lng" value="-80.135205" step="any">
    </div>

    <button id="save">Save & Apply Settings</button>
    <button id="reset-session" class="secondary">Force Clear Nextdoor Session</button>

    <div id="status" class="status"></div>

    <p class="hint">Ghost Protocol: 100% Mobile Coherence.<br>Wipe session + Refresh.</p>

    <script src="popup.js"></script>
</body>

</html>
